name: backend

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # A disposable, default-credentials DB scoped to this job only — never
      # the SSM-stored production password (see infra/specs/SPEC.md).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/checkout_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run test:cov

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REPOSITORY_URL: ${{ vars.BACKEND_ECR_REPOSITORY_URL }}
        run: |
          docker build -t "$REPOSITORY_URL:latest" .
          docker push "$REPOSITORY_URL:latest"

      # Re-runs infra/templates/deploy.sh.tpl's rendered script already on the
      # instance (task 2) — it re-reads secrets from SSM and does
      # `docker compose pull && up -d`, same as first boot.
      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /opt/checkout/deploy.sh"]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
